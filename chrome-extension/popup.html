<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="header">
    <div class="logo-title">
      <div class="logo-icon">⚡</div>
      <span class="brand-name">MR.DEVS CRM</span>
    </div>
    <div id="statusBadge" style="font-size: 10px; color: #3ecf8e; background: rgba(62,207,142,0.1); padding: 2px 6px; border-radius: 4px;">Extension</div>
  </div>

  <div id="errorBanner" class="error-banner" style="display: none;"></div>

  <!-- LOGIN VIEW -->
  <div id="loginView">
    <div class="card">
      <h4 style="margin-bottom: 12px; font-size: 13px; color: #f5f5f0;">Rep Sign In</h4>
      
      <button type="button" class="btn-google" id="googleLoginBtn">
        <svg width="14" height="14" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Sign in with Google
      </button>

      <div class="divider">OR</div>

      <form id="loginForm">
        <div class="form-group">
          <label>CRM Email</label>
          <input type="email" id="loginEmail" placeholder="sales@mrdevs.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary" id="loginBtn">Sign In with Password</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashboardView" style="display: none;">
    <div class="card" style="margin-bottom: 12px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div>
          <div id="repName" style="font-weight: 700; color: #f5f5f0; font-size: 13px;">Sales Rep</div>
          <div id="repEmail" style="font-size: 11px; color: #8a8a85;">rep@mrdevs.com</div>
        </div>
        <button id="logoutBtn" class="btn-ghost">Logout</button>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-box">
        <div id="todayTouches" class="stat-val">0</div>
        <div class="stat-lbl">Today's Auto Touches</div>
      </div>
      <div class="stat-box">
        <div id="verifiedStatus" class="stat-val" style="color: #3ecf8e;">ACTIVE</div>
        <div class="stat-lbl">Gmail Detection</div>
      </div>
    </div>

    <div class="card">
      <div style="font-size: 11px; font-weight: 600; color: #8a8a85; margin-bottom: 8px;">Recent Extension Events</div>
      <div id="activityList" class="activity-list">
        <div style="color: #8a8a85; font-size: 11px;">Listening for Gmail outreach...</div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
